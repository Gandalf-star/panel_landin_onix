name: panel_admin_onix
description: "Panel admin del Reto 50 Onix: reclamos de premio, verificacion de codigos y participantes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  # Avisos del navegador (Notification API) y titulo de la pestaña.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # El .env viaja como asset: es la unica forma de que flutter_dotenv
    # pueda leerlo cuando la app corre en el navegador.
    - .env
